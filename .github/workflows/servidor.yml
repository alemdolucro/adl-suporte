name: ADL Suporte - servidor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["servidor/**", ".github/workflows/servidor.yml"]

permissions:
  contents: read
  packages: write

jobs:
  servidor:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - name: Compilar hbbs e hbbr
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          cargo build --release --bin hbbs --bin hbbr
          cp target/release/hbbs target/release/hbbr .
      - name: Login no GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Publicar imagem
        run: |
          IMG=ghcr.io/alemdolucro/adl-suporte-servidor
          docker build -t $IMG:latest -t $IMG:${GITHUB_SHA::7} .
          docker push $IMG:latest
          docker push $IMG:${GITHUB_SHA::7}
